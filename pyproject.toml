[project]
name = "stock-research-bench"
version = "0.1.0"
description = "多 Agent 股票研判工作台：分析师并行 → 多空辩论 → 交易员 → 风控回环 → 投委会"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "akshare>=1.18",
    "python-dotenv>=1.0",
    "pytest>=8.0",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
http-timeout = 180
